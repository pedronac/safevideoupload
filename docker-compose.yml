# Ports exposés sur l'hôte (pare-feu VPS) : 80 et 443 (TCP) uniquement — Caddy.
# Plus de MediaMTX ni de port 8189 : la version hors-ligne n'a pas de direct WebRTC.
# Tout le reste (api, blur, admin) reste sur le réseau Docker.

x-storage-env: &storage-env
  STORAGE_DIR: /storage

services:
  api:
    build:
      context: ./services
      dockerfile: api/Dockerfile
    container_name: safevideoupload-api
    restart: unless-stopped
    environment:
      <<: *storage-env
      PUBLIC_PAGE_ENABLED: ${PUBLIC_PAGE_ENABLED:-true}
      MAX_PART_MB: ${MAX_PART_MB:-256}
      MIN_FREE_GB: ${MIN_FREE_GB:-2}
    volumes:
      - ./storage:/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  blur:
    build:
      context: ./services
      dockerfile: blur/Dockerfile
    container_name: safevideoupload-blur
    restart: unless-stopped
    environment:
      <<: *storage-env
      SEGMENT_SECONDS: ${SEGMENT_SECONDS:-60}
      # Échelle d'analyse des visages, écrite en paysage ; inversée automatiquement en portrait.
      BLUR_PROCESS_SCALE: ${BLUR_PROCESS_SCALE:-480x270}
      # Segments floutés en parallèle (surveiller le CPU : 4 vCPU => 2 workers x 2 threads).
      BLUR_PROCESSOR_WORKERS: ${BLUR_PROCESSOR_WORKERS:-2}
      BLUR_ASSEMBLE_SESSION: ${BLUR_ASSEMBLE_SESSION:-true}
      BLUR_X264_PRESET: ${BLUR_X264_PRESET:-veryfast}
      SESSION_AUTOCLOSE_S: ${SESSION_AUTOCLOSE_S:-21600}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
      ONNXRUNTIME_INTRA_OP_NUM_THREADS: ${ONNXRUNTIME_INTRA_OP_NUM_THREADS:-}
      ONNXRUNTIME_INTER_OP_NUM_THREADS: ${ONNXRUNTIME_INTER_OP_NUM_THREADS:-}
    volumes:
      - ./storage:/storage

  admin:
    build:
      context: ./services
      dockerfile: admin/Dockerfile
    container_name: safevideoupload-admin
    restart: unless-stopped
    depends_on:
      - api
    environment:
      <<: *storage-env
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN requis (openssl rand -hex 32)}
      PROJECT_DIR: /project
      ENV_FILE: /project/.env
      COMPOSE_FILE: /project/docker-compose.yml
      DISK_WARN_FREE_PERCENT: ${DISK_WARN_FREE_PERCENT:-15}
    volumes:
      - .:/project
      - ./storage:/storage
      - /var/run/docker.sock:/var/run/docker.sock

  caddy:
    image: caddy:2-alpine
    container_name: safevideoupload-caddy
    restart: unless-stopped
    depends_on:
      - api
      - admin
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-internal@localhost}
      CAPTURE_TOKEN: ${CAPTURE_TOKEN:?CAPTURE_TOKEN requis (openssl rand -hex 32)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN requis (openssl rand -hex 32)}
      PUBLIC_PAGE_ENABLED: ${PUBLIC_PAGE_ENABLED:-true}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web/public:/srv/public:ro
      - ./web/capture:/srv/capture:ro
      - ./web/admin:/srv/admin:ro
      - ./storage/raw:/storage/raw:ro
      - ./storage/blurred:/storage/blurred:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
